name: Staging business workflow

on:
  workflow_dispatch:

jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      STAGING_BASE_URL: https://odin-erp-web.vercel.app
      ODIN_DEMO_PASSWORD: ${{ secrets.ODIN_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/staging-business-workflow.spec.ts --project=chromium
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-business-workflow-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
