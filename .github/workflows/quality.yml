name: AV8 delivery gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: av8_test
          POSTGRES_USER: av8_owner
          POSTGRES_PASSWORD: ephemeral-ci-owner-only
        ports: ['5549:5432']
        options: >-
          --health-cmd "pg_isready -U av8_owner -d av8_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CI: 'true'
      AV8_CI_ADMIN_URL: postgresql://av8_owner:ephemeral-ci-owner-only@127.0.0.1:5549/av8_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install PDF and matching PostgreSQL recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils curl ca-certificates gpg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - run: node scripts/av8/init-ci.mjs
      - run: node scripts/av8/run.mjs test npm run db:generate
      - run: node scripts/av8/run.mjs test npm run db:validate
      - run: node scripts/av8/run.mjs test npm run db:migrate
      - run: node scripts/av8/run.mjs test npm run db:seed
      - run: npm run lint
      - run: node scripts/av8/run.mjs test npm run typecheck
      - run: npm run i18n:audit
      - run: node --test scripts/av8/web-isolation.test.mjs
      - run: node --test deploy/hetzner/*.test.mjs
      - run: npm run security:history
      - run: npm run security:audit
      - run: npm run security:scan
      - run: node scripts/av8/run.mjs test npm test
      - run: node scripts/av8/run.mjs test npm run integrity
      - run: node scripts/av8/run.mjs test npm run build
      - run: npm run security:scan
      - run: npx playwright install --with-deps chromium
      - run: node scripts/av8/run.mjs test node .av8/api/src/scripts/av8-pos-uat.js
      - run: node scripts/av8/run.mjs test node .av8/api/src/scripts/av8-supplier-uat.js > .av8/supplier-uat-fixture.json
      - run: node scripts/av8/run.mjs test node scripts/av8/prepare-finance-uat.mjs
      - run: node scripts/av8/run.mjs test node scripts/av8/operations-uat.cjs
      - run: node scripts/av8/run.mjs test node scripts/av8/prepare-opening-uat.cjs
      - name: Start tested services
        run: |
          node scripts/av8/run.mjs test npm run start > .av8/services.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8181/api/health >/dev/null && curl --fail --silent http://127.0.0.1:8180/login >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Service health timed out; inspect restricted runner diagnostics.'
          exit 1
      - run: node scripts/av8/run.mjs test env AV8_BROWSER_PRODUCTION=1 npx playwright test -c playwright.delivery.config.ts
      - name: Encrypted isolated database and document recovery
        run: node scripts/av8/run.mjs test node scripts/av8/recovery-drill.mjs
      - name: Upload synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: av8-delivery-evidence
          path: |
            output/playwright/final-delivery/
            output/pdf/final-delivery/
            output/recovery/evidence.json
          retention-days: 14
