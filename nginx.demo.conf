server {
    listen 80;
    listen [::]:80;
    server_name demo.odin-ltd.com;
    large_client_header_buffers 4 64k;
    location /.well-known/acme-challenge/ { root /srv/demo/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.odin-ltd.com;
    large_client_header_buffers 4 64k;
    ssl_certificate /etc/letsencrypt/live/demo.odin-ltd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.odin-ltd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
